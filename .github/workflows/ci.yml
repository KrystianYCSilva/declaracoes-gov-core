name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test and enforce coverage
        run: mvn -B -q verify
        env:
          MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            */target/surefire-reports/*.xml
            */target/surefire-reports/*.txt

      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: |
            */target/site/jacoco/index.html
            */target/site/jacoco/*.html

      - name: Comment PR with coverage summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const modules = ['declaracoes-gov-core-domain', 'declaracoes-gov-core-format', 'declaracoes-gov-core-xml', 'declaracoes-gov-core-crypto'];
            let body = '## CI Coverage Summary\n\n| Module | Line | Branch | Status |\n|--------|------|--------|--------|\n';

            let allPassed = true;
            for (const mod of modules) {
              const reportPath = path.join(mod, 'target', 'site', 'jacoco', 'index.html');
              if (fs.existsSync(reportPath)) {
                const content = fs.readFileSync(reportPath, 'utf8');
                const lineMatch = content.match(/Total[^%]*?(\d+)%/);
                const branchMatch = content.match(/Total[^%]*?\d+%[^%]*?(\d+)%/);
                const line = lineMatch ? lineMatch[1] + '%' : 'N/A';
                const branch = branchMatch ? branchMatch[1] + '%' : 'N/A';
                const status = line !== 'N/A' ? '✅' : '⚠️';
                body += `| ${mod} | ${line} | ${branch} | ${status} |\n`;
              } else {
                body += `| ${mod} | N/A | N/A | ⚠️ |\n`;
                allPassed = false;
              }
            }

            body += '\n> Gates: domain/format/xml ≥ 90% line & branch; crypto ≥ 85% line / 90% branch.';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.user.login === 'github-actions[bot]' && comment.body.includes('CI Coverage Summary'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
